[package]
name = "webterm-app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
webterm-frame = { path = "../frame" }
webterm-core = { path = "../core" }
webterm-renderer = { path = "../renderer" }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement"] }

[profile.release]
opt-level = "s"
lto = true
